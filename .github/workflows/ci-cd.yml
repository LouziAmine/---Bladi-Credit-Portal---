name: Frontend CI/CD

# build-test : lint, unit tests with coverage (Vitest), dependency audit, production build; publishes the
#              built SPA and the coverage report as workflow artifacts.
# docker     : builds the nginx runtime image (SPA + /api reverse proxy) and pushes it to ghcr.io.
# deploy     : optional: triggers the cloud platform's deploy hook once the image is published.
#              Enabled per GitHub environment (see docs/deployment.md), skipped otherwise.

on:
  push:
    branches: [master, main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: credit-bladi-portal

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Lint (style + SAST rules)
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage -- --watch=false

      - name: Dependency audit
        run: npm run test:security:sca

      - name: Production build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: bladi-credit-portal-dist
          path: dist/bladi-credit-portal/browser
          if-no-files-found: error

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: ignore

  docker:
    name: Docker image
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Image name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (${{ github.ref_type == 'tag' && 'production' || 'staging' }})
    needs: docker
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    steps:
      - name: Trigger the platform deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.docker.outputs.image }}:sha-${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::DEPLOY_HOOK_URL secret is not set for this environment"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 -X POST \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"${IMAGE}\",\"ref\":\"${GITHUB_REF_NAME}\",\"sha\":\"${GITHUB_SHA}\"}" \
            "$DEPLOY_HOOK_URL"
          echo "Deploy requested for ${IMAGE}"

      - name: Smoke test
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 5 -o /dev/null "$APP_URL"; then
              echo "Reachable: $APP_URL"; exit 0
            fi
            sleep 10
          done
          echo "::error::$APP_URL did not answer within 5 minutes"
          exit 1
